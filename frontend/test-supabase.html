<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Test</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Supabase Connection Test</h1>
    <div id="status">Проверяем подключение...</div>
    <div id="result"></div>

    <script>
        const supabaseUrl = 'https://kackbfwjspxbvkucytre.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthY2tiZndqc3B4YnZrdWN5dHJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM2OTQxNTQsImV4cCI6MjA2OTI3MDE1NH0.L8N8MY1MLZskar3IfLHGqu9L1ZKnMe9Fp1FbFrAoVuQ';

        const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

        async function testConnection() {
            try {
                document.getElementById('status').textContent = 'Тестируем подключение...';
                
                // Тест 1: Проверка подключения
                const { data: testData, error: testError } = await supabase
                    .from('card_templates')
                    .select('count')
                    .limit(1);
                
                if (testError) {
                    document.getElementById('result').innerHTML = `
                        <h3>Ошибка подключения:</h3>
                        <pre>${JSON.stringify(testError, null, 2)}</pre>
                    `;
                } else {
                    document.getElementById('result').innerHTML = `
                        <h3>Подключение успешно!</h3>
                        <p>Таблица card_templates доступна</p>
                        <pre>${JSON.stringify(testData, null, 2)}</pre>
                    `;
                }
                
                document.getElementById('status').textContent = 'Тест завершен';
                
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <h3>Критическая ошибка:</h3>
                    <pre>${error.message}</pre>
                `;
                document.getElementById('status').textContent = 'Тест завершен с ошибкой';
            }
        }

        // Запускаем тест при загрузке страницы
        testConnection();
    </script>
</body>
</html>
