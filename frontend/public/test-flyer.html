<!DOCTYPE html>
<html>

<head>
    <title>Apple Wallet Badge Test</title>
    <style>
        body {
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .flyer {
            width: 444px;
            height: 630px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px;
            box-sizing: border-box;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>
    <div class="flyer">
        <div style="font-size: 28px; font-weight: 700; text-align: center; margin-bottom: 16px; color: #000000;">
            Espresso
        </div>
        <div style="font-size: 20px; font-weight: 600; text-align: center; margin-bottom: 32px; color: #000000;">
            Получи бонусную карту
        </div>
        <div style="background: #fff; padding: 16px; border: 2px solid #000; border-radius: 8px; margin-bottom: 32px;">
            <div
                style="width: 220px; height: 220px; background: #eee; display: flex; align-items: center; justify-content: center;">
                [QR Code]</div>
        </div>
        <div style="font-size: 16px; font-weight: 500; text-align: center; margin-bottom: 40px; color: #000000;">
            Наведи камеру, чтобы получить
        </div>

        <!-- Apple Wallet Badge - TABLE-CELL version -->
        <div style="background-color: #000000; color: #ffffff; padding: 14px 32px; border-radius: 8px; display: table;">
            <div style="display: table-cell; vertical-align: middle;">
                <img src="/apple-wallet-logo.png" alt="Apple Wallet"
                    style="width: 32px; height: 32px; display: block;" />
            </div>
            <div style="display: table-cell; vertical-align: middle; padding-left: 12px;">
                <span style="font-size: 16px; font-weight: 500; white-space: nowrap;">Apple Wallet</span>
            </div>
        </div>

    </div>
</body>

</html>
